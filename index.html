<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Works</title>

<style>

/* =========================
   BASIC
========================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    background: #0b0b0b;
    color: #ffffff;
    font-family: Arial, Helvetica, sans-serif;
    overflow-x: hidden;
}


/* =========================
   HEADER
========================= */

.header {
    text-align: center;
    padding: 80px 20px 45px;
}

.header h1 {
    font-size: clamp(42px, 6vw, 72px);
    font-weight: 400;
    letter-spacing: -2px;
}

.header p {
    margin-top: 15px;
    color: #999;
    font-size: 15px;
    letter-spacing: 1px;
}


/* =========================
   POLAROID GALLERY
========================= */

.polaroid-section {
    width: 100%;
    overflow: hidden;
    margin-top: 20px;
}

.polaroid-window {
    width: 100%;
    overflow: hidden;
    position: relative;
}

.polaroid-track {
    display: flex;
    width: max-content;
    gap: 22px;

    animation: polaroidMove 45s linear infinite;

    will-change: transform;
}

.polaroid-window:hover .polaroid-track {
    animation-play-state: paused;
}


/* Polaroid cards */

.polaroid {
    width: 210px;
    height: 255px;

    flex-shrink: 0;

    background: #f5f5f5;

    padding: 9px 9px 30px 9px;

    box-shadow:
        0 10px 30px rgba(0,0,0,0.45);

    position: relative;

    transition:
        transform 0.4s ease,
        box-shadow 0.4s ease;
}


/* Slight rotation */

.polaroid:nth-child(3n) {
    transform: rotate(1.5deg);
}

.polaroid:nth-child(3n + 1) {
    transform: rotate(-1deg);
}

.polaroid:nth-child(3n + 2) {
    transform: rotate(0.5deg);
}


/* Hover */

.polaroid:hover {

    transform:
        rotate(0deg)
        translateY(-12px)
        scale(1.03);

    box-shadow:
        0 20px 45px rgba(0,0,0,0.65);

    z-index: 5;
}


/* Image */

.polaroid img {

    width: 100%;
    height: 100%;

    object-fit: cover;

    display: block;

}


/* Infinite scrolling */

@keyframes polaroidMove {

    0% {
        transform: translateX(0);
    }

    100% {
        transform: translateX(-50%);
    }

}


/* Fade edges */

.polaroid-window::before,
.polaroid-window::after {

    content: "";

    position: absolute;

    top: 0;
    bottom: 0;

    width: 100px;

    z-index: 10;

    pointer-events: none;
}

.polaroid-window::before {

    left: 0;

    background:
        linear-gradient(
            to right,
            #0b0b0b,
            transparent
        );
}

.polaroid-window::after {

    right: 0;

    background:
        linear-gradient(
            to left,
            #0b0b0b,
            transparent
        );
}


/* =========================
   DIVIDER
========================= */

.divider {

    width: 80px;

    height: 1px;

    background: #555;

    margin: 110px auto 45px;

}


/* =========================
   PHOTOGRAPHY BOOK
========================= */

.book-section {

    max-width: 1100px;

    margin: 0 auto;

    padding: 0 20px 120px;

    text-align: center;

}

.book-title {

    font-size: 32px;

    font-weight: 400;

    letter-spacing: 1px;

}

.book-subtitle {

    color: #777;

    font-size: 13px;

    margin-top: 10px;

    letter-spacing: 1px;

}


/* =========================
   BOOK CONTAINER
========================= */

.book-wrapper {

    width: 100%;

    max-width: 760px;

    margin: 55px auto 0;

    perspective: 1800px;

}


/* Book */

.book {

    position: relative;

    width: 100%;

    aspect-ratio: 1.25 / 1;

    background: #171717;

    border-radius: 4px;

    box-shadow:
        0 30px 80px rgba(0,0,0,0.65);

    overflow: hidden;

}


/* Book spine */

.book::before {

    content: "";

    position: absolute;

    left: 50%;

    top: 0;

    bottom: 0;

    width: 2px;

    transform: translateX(-50%);

    background:
        linear-gradient(
            to right,
            rgba(0,0,0,0.6),
            rgba(255,255,255,0.12),
            rgba(0,0,0,0.6)
        );

    z-index: 20;

    pointer-events: none;

}


/* Page area */

.page-area {

    position: absolute;

    inset: 18px;

    background: #e9e5dc;

    overflow: hidden;

    box-shadow:
        inset 0 0 30px rgba(0,0,0,0.15);

}


/* Page underneath */

.under-page {

    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: contain;

    background: #f2eee6;

    display: block;

}


/* Current page */

.book-page {

    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: contain;

    background: #f2eee6;

    display: block;

    transform-origin: left center;

    backface-visibility: hidden;

    -webkit-backface-visibility: hidden;

    box-shadow:
        10px 0 25px rgba(0,0,0,0.2);

}


/* =========================
   PAGE TURN
========================= */

.book-page.next-turn {

    animation:
        nextPage 0.9s cubic-bezier(.77,0,.18,1)
        forwards;

}


@keyframes nextPage {

    0% {

        transform: rotateY(0deg);

        box-shadow:
            10px 0 25px rgba(0,0,0,0.2);

    }

    50% {

        box-shadow:
            -20px 0 45px rgba(0,0,0,0.45);

    }

    100% {

        transform: rotateY(-180deg);

        box-shadow:
            -10px 0 25px rgba(0,0,0,0.1);

    }

}


.book-page.previous-turn {

    animation:
        previousPage 0.9s cubic-bezier(.77,0,.18,1)
        forwards;

}


@keyframes previousPage {

    0% {

        transform: rotateY(-180deg);

    }

    100% {

        transform: rotateY(0deg);

    }

}


/* =========================
   BOOK BUTTONS
========================= */

.book-controls {

    margin-top: 30px;

    display: flex;

    justify-content: center;

    align-items: center;

    gap: 20px;

}


.book-controls button {

    border: 1px solid #555;

    background: transparent;

    color: white;

    padding: 12px 25px;

    font-size: 12px;

    letter-spacing: 1px;

    cursor: pointer;

    transition:
        background 0.3s ease,
        color 0.3s ease;

}


.book-controls button:hover {

    background: white;

    color: black;

}


.book-controls button:disabled {

    opacity: 0.3;

    cursor: default;

}


.page-number {

    color: #777;

    font-size: 13px;

    min-width: 70px;

}


/* =========================
   FOOTER
========================= */

.footer {

    text-align: center;

    color: #555;

    font-size: 12px;

    letter-spacing: 1px;

    padding-bottom: 50px;

}


/* =========================
   MOBILE
========================= */

@media (max-width: 700px) {

    .header {

        padding-top: 55px;

    }


    .polaroid {

        width: 165px;

        height: 205px;

        padding:
            7px
            7px
            24px
            7px;

    }


    .polaroid-track {

        gap: 15px;

        animation-duration: 32s;

    }


    .divider {

        margin-top: 80px;

    }


    .book-title {

        font-size: 26px;

    }


    .book-wrapper {

        margin-top: 35px;

    }


    .page-area {

        inset: 10px;

    }


    .book-controls {

        gap: 10px;

    }


    .book-controls button {

        padding: 10px 14px;

        font-size: 10px;

    }

}


/* =========================
   REDUCED MOTION
========================= */

@media (prefers-reduced-motion: reduce) {

    .polaroid-track {

        animation: none;

    }

}

</style>

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header class="header">

    <h1>My Works</h1>

    <p>
        Photography · Visual Stories · Creative Experiments
    </p >

</header>



<!-- =========================
     POLAROID GALLERY
========================= -->

<section class="polaroid-section">

    <div class="polaroid-window">

        <div
            id="polaroidTrack"
            class="polaroid-track">
        </div>

    </div>

</section>



<!-- =========================
     DIVIDER
========================= -->

<div class="divider"></div>



<!-- =========================
     PHOTOGRAPHY BOOK
========================= -->

<section class="book-section">

    <h2 class="book-title">
        Photography Book
    </h2>

    <p class="book-subtitle">
        A collection of visual moments
    </p >


    <div class="book-wrapper">

        <div class="book">

            <div class="page-area">

                <img
                    id="underPage"
                    class="under-page"
                    src="book_02.jpg"
                    alt=""
                >

                <img
                    id="bookPage"
                    class="book-page"
                    src="book_01.jpg"
                    alt="Photography Book"
                >

            </div>

        </div>

    </div>


    <!-- English controls -->

    <div class="book-controls">

        <button id="prevButton">
            ← PREVIOUS PAGE
        </button>


        <div
            id="pageNumber"
            class="page-number">

            01 / 35

        </div>


        <button id="nextButton">
            NEXT PAGE →

        </button>

    </div>

</section>



<!-- =========================
     FOOTER
========================= -->

<div class="footer">

    MY WORKS · PHOTOGRAPHY

</div>



<script>


/* =====================================================
   POLAROID GALLERY
===================================================== */


const polaroidImages = [

    "polar-1.jpeg",
    "polar-2.jpeg",
    "polar-3.jpeg",
    "polar-4.jpeg",
    "polar-5.jpeg",
    "polar-6.jpeg",
    "polar-7.jpeg",
    "polar-8.jpeg",
    "polar-9.jpeg",
    "polar-10.jpeg",
    "polar-11.jpeg",
    "polar-12.jpeg",
    "polar-13.jpeg",
    "polar-14.jpeg",
    "polar-15.jpeg",
    "polar-16.jpeg",
    "polar-17.jpeg",
    "polar-18.jpeg",
    "polar-19.jpeg",
    "polar-20.jpeg",
    "polar-21.jpeg",
    "polar-22.jpeg",
    "polar-23.jpeg",
    "polar-24.jpeg",
    "polar-25.jpeg",
    "polar-26.jpeg",
    "polar-27.jpeg",
    "polar-28.jpeg",
    "polar-29.jpeg",
    "polar-30.jpeg"

];


const polaroidTrack =
    document.getElementById("polaroidTrack");


/* Duplicate images for seamless loop */

const galleryImages = [
    ...polaroidImages,
    ...polaroidImages
];


galleryImages.forEach(function(fileName) {

    const card =
        document.createElement("div");


    card.className =
        "polaroid";


    const image =
        document.createElement("img");


    image.src =
        fileName;


    image.alt =
        "Photography";


    image.loading =
        "lazy";


    card.appendChild(image);


    polaroidTrack.appendChild(card);

});



/* =====================================================
   PHOTOGRAPHY BOOK
===================================================== */


const totalPages = 35;

let currentPage = 1;

let isTurning = false;


const bookPage =
    document.getElementById("bookPage");


const underPage =
    document.getElementById("underPage");


const pageNumber =
    document.getElementById("pageNumber");


const nextButton =
    document.getElementById("nextButton");


const prevButton =
    document.getElementById("prevButton");



/* Format number */

function formatPage(number) {

    return String(number).padStart(2, "0");

}



/* Update page counter */

function updateCounter() {

    pageNumber.textContent =
        formatPage(currentPage)
        + " / "
        + totalPages;

}



/* Update buttons */

function updateButtons() {

    prevButton.disabled =
        currentPage === 1;

    nextButton.disabled =
        currentPage === totalPages;

}



/* =====================================================
   NEXT PAGE
===================================================== */

function nextPage() {

    if (
        isTurning ||
        currentPage >= totalPages
    ) {

        return;

    }


    isTurning = true;


    const nextNumber =
        currentPage + 1;


    underPage.src =
        "book_"
        + formatPage(nextNumber)
        + ".jpg";


    bookPage.classList.remove(
        "previous-turn"
    );


    void bookPage.offsetWidth;


    bookPage.classList.add(
        "next-turn"
    );


    currentPage =
        nextNumber;


    updateCounter();

    updateButtons();


    setTimeout(function() {

        bookPage.src =
            "book_"
            + formatPage(currentPage)
            + ".jpg";


        bookPage.classList.remove(
            "next-turn"
        );


        isTurning = false;

    }, 900);

}



/* =====================================================
   PREVIOUS PAGE
===================================================== */

function previousPage() {

    if (
        isTurning ||
        currentPage <= 1
    ) {

        return;

    }


    isTurning = true;


    const previousNumber =
        currentPage - 1;


    underPage.src =
        "book_"
        + formatPage(previousNumber)
        + ".jpg";


    bookPage.classList.remove(
        "next-turn"
    );


    void bookPage.offsetWidth;


    bookPage.classList.add(
        "previous-turn"
    );


    currentPage =
        previousNumber;


    updateCounter();

    updateButtons();


    setTimeout(function() {

        bookPage.src =
            "book_"
            + formatPage(currentPage)
            + ".jpg";


        bookPage.classList.remove(
            "previous-turn"
        );


        isTurning = false;

    }, 900);

}



/* =====================================================
   BUTTONS
===================================================== */

nextButton.addEventListener(
    "click",
    nextPage
);


prevButton.addEventListener(
    "click",
    previousPage
);



/* =====================================================
   KEYBOARD
===================================================== */

document.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "ArrowRight") {

            nextPage();

        }


        if (event.key === "ArrowLeft") {

            previousPage();

        }

    }
);



/* =====================================================
   INITIAL STATE
===================================================== */

updateCounter();

updateButtons();


</script>


</body>

</html>
