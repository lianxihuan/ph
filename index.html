<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Works</title>
    <style>
        body { font-family: sans-serif; max-width: 1200px; margin: 0 auto; padding: 20px; }
        .polaroid-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; margin: 30px 0; }
        .polaroid-grid img { width: 100%; height: 200px; object-fit: cover; border: 8px solid white; box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
        .book-viewer { margin: 40px 0; text-align: center; }
        .book-viewer img { max-width: 600px; max-height: 80vh; border: 12px solid #f0f0f0; }
        .book-controls { margin-top: 20px; gap: 12px; display: flex; justify-content: center; }
        .book-controls button { padding: 10px 24px; font-size: 16px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>My Polaroid Gallery</h1>
    <div class="polaroid-grid">
        <img src="polar-1.jpeg">
        <img src="polar-2.jpeg">
        <img src="polar-3.jpeg">
        <img src="polar-4.jpeg">
        <img src="polar-5.jpeg">
        <img src="polar-6.jpeg">
        <img src="polar-7.jpeg">
        <img src="polar-8.jpeg">
        <img src="polar-9.jpeg">
        <img src="polar-10.jpeg">
        <img src="polar-11.jpeg">
        <img src="polar-12.jpeg">
        <img src="polar-13.jpeg">
        <img src="polar-14.jpeg">
        <img src="polar-15.jpeg">
        <img src="polar-16.jpeg">
        <img src="polar-17.jpeg">
        <img src="polar-18.jpeg">
        <img src="polar-19.jpeg">
        <img src="polar-20.jpeg">
        <img src="polar-21.jpeg">
        <img src="polar-22.jpeg">
        <img src="polar-23.jpeg">
        <img src="polar-24.jpeg">
        <img src="polar-25.jpeg">
        <img src="polar-26.jpeg">
        <img src="polar-27.jpeg">
        <img src="polar-28.jpeg">
        <img src="polar-29.jpeg">
        <img src="polar-30.jpeg">
    </div>

    <div class="book-viewer">
        <h2>Photography Book</h2>
        <img id="bookImg" src="book_01.jpg">
        <div class="book-controls">
            <button onclick="prev()">上一页</button>
            <button onclick="next()">下一页</button>
        </div>
    </div>

<script>
    const totalBookPages = 35;
    let current = 1;
    function refreshBook() {
        document.getElementById("bookImg").src = `book_${String(current).padStart(2,'0')}.jpg`;
    }
    function next() {
        if(current < totalBookPages) { current++; refreshBook(); }
    }
    function prev() {
        if(current > 1) { current--; refreshBook(); }
    }
</script>
</body>
</html>
